<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>설교 마이크</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 24px 16px; background: #111; color: #eee; text-align: center;
    font: 17px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  }
  h1 { margin: 0; font-size: 24px; }
  button { font: inherit; border: 0; border-radius: 14px; cursor: pointer; }
  #start { width: min(320px, 100%); padding: 28px 0; font-size: 26px; font-weight: 700; background: #2f6fde; color: #fff; }
  #start.on { background: #8a2a2a; }
  .meter { width: min(320px, 100%); height: 22px; border-radius: 11px; background: #2a2a2a; overflow: hidden; }
  #bar { height: 100%; width: 0; background: #3c3; transition: width 120ms linear; }
  #status { min-height: 1.5em; color: #bbb; }
  #translate { font-weight: 700; }
  .ok { color: #5d5; } .off { color: #f88; } .warn { color: #ffb36b; }
  .note { max-width: 340px; color: #888; font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>
  <h1>설교 마이크</h1>
  <button id="start">시작</button>
  <div class="meter"><div id="bar"></div></div>
  <div id="status">'시작'을 누르세요.</div>
  <div id="translate"></div>
  <p class="note">
    예배 중에는 이 화면을 <b>켜 둔 채</b> 두세요. 화면이 꺼지거나 다른 앱으로 넘어가면 소리가 끊깁니다.<br>
    충전기에 꽂아 두시고, 방해 금지 모드를 켜 두세요.
  </p>
<script>
'use strict';
const TARGET_RATE = 16000;
const CHUNK_SAMPLES = TARGET_RATE / 10; // 100 ms, what the translation engine expects

const startBtn = document.getElementById('start');
const bar = document.getElementById('bar');
const statusEl = document.getElementById('status');
const translateEl = document.getElementById('translate');

let ctx = null, stream = null, node = null, ws = null, running = false, wakeLock = null, retry = null;

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || '';
}

if (!window.isSecureContext || !navigator.mediaDevices) {
  setStatus('이 페이지는 https 주소로 열어야 마이크를 쓸 수 있습니다. 맥 터미널에 나온 https:// 주소를 그대로 여세요.', 'warn');
  startBtn.disabled = true;
}

// Mic → 16 kHz 16-bit mono. Each output sample averages the input samples it covers,
// which also filters out what 16 kHz cannot carry (input is usually 44.1 or 48 kHz).
function makeResampler(inRate) {
  const ratio = inRate / TARGET_RATE;
  let pos = 0, acc = 0, n = 0;
  const out = new Int16Array(CHUNK_SAMPLES);
  let fill = 0;
  return (input, emit) => {
    for (let i = 0; i < input.length; i++) {
      acc += input[i]; n++; pos += 1;
      if (pos >= ratio) {
        pos -= ratio;
        const v = Math.max(-1, Math.min(1, acc / n));
        out[fill++] = v < 0 ? v * 0x8000 : v * 0x7fff;
        acc = 0; n = 0;
        if (fill === CHUNK_SAMPLES) { emit(out.slice().buffer); fill = 0; }
      }
    }
  };
}

const WORKLET = `
class Tap extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (ch) this.port.postMessage(ch.slice(0));
    return true;
  }
}
registerProcessor('tap', Tap);`;

function connectSocket() {
  clearTimeout(retry);
  ws = new WebSocket(`wss://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => setStatus('맥에 연결됨 · 소리 보내는 중', 'ok');
  ws.onmessage = (ev) => {
    try {
      const s = JSON.parse(ev.data);
      if (s.test) translateEl.textContent = '(시험 모드: 번역 없음)';
      else if (typeof s.translating === 'boolean') {
        translateEl.textContent = s.translating ? '번역 켜짐' : '번역 꺼짐 (찬양·성경 봉독 등)';
        translateEl.className = s.translating ? 'ok' : 'off';
      }
    } catch (e) { /* ignore */ }
  };
  ws.onclose = () => {
    if (!running) return;
    setStatus('맥과 연결이 끊겼습니다. 다시 연결하는 중…', 'warn');
    retry = setTimeout(connectSocket, 2000);
  };
}

async function keepAwake() {
  try {
    if ('wakeLock' in navigator && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) { /* not supported: the note asks to keep the screen on */ }
}

async function start() {
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: false, noiseSuppression: true, autoGainControl: true },
  });
  const AC = window.AudioContext || window.webkitAudioContext;
  ctx = new AC();
  await ctx.resume();
  const url = URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' }));
  await ctx.audioWorklet.addModule(url);
  const src = ctx.createMediaStreamSource(stream);
  node = new AudioWorkletNode(ctx, 'tap');
  const resample = makeResampler(ctx.sampleRate);
  let peak = 0, lastDraw = 0;
  node.port.onmessage = (ev) => {
    const frame = ev.data;
    for (let i = 0; i < frame.length; i++) peak = Math.max(peak, Math.abs(frame[i]));
    resample(frame, (buf) => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(buf);
    });
    const now = performance.now();
    if (now - lastDraw > 120) {
      bar.style.width = Math.min(100, Math.round(peak * 140)) + '%';
      peak = 0; lastDraw = now;
    }
  };
  src.connect(node);
  // Some browsers only run a worklet that leads somewhere; a silent gain keeps it out of the speaker
  const mute = ctx.createGain();
  mute.gain.value = 0;
  node.connect(mute).connect(ctx.destination);
  running = true;
  connectSocket();
  keepAwake();
  startBtn.textContent = '멈추기';
  startBtn.classList.add('on');
}

function stop() {
  running = false;
  clearTimeout(retry);
  if (ws) ws.close();
  if (node) node.disconnect();
  if (stream) stream.getTracks().forEach((t) => t.stop());
  if (ctx) ctx.close();
  if (wakeLock) wakeLock.release().catch(() => {});
  ctx = stream = node = ws = wakeLock = null;
  bar.style.width = '0';
  translateEl.textContent = '';
  setStatus('멈춤. 다시 시작하려면 \'시작\'을 누르세요.');
  startBtn.textContent = '시작';
  startBtn.classList.remove('on');
}

startBtn.onclick = async () => {
  if (running) { stop(); return; }
  startBtn.disabled = true;
  try {
    await start();
  } catch (e) {
    setStatus('마이크를 쓸 수 없습니다: ' + (e && e.message ? e.message : e) +
      ' — 설정 > Safari > 마이크 에서 허용으로 바꾼 뒤 다시 누르세요.', 'warn');
    stop();
  } finally {
    startBtn.disabled = false;
  }
};

document.addEventListener('visibilitychange', () => {
  if (!running) return;
  if (document.visibilityState === 'visible') {
    if (ctx && ctx.state !== 'running') ctx.resume();
    keepAwake();
    if (!ws || ws.readyState > 1) connectSocket();
  }
});
</script>
</body>
</html>
